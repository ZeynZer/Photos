<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion – Zeyn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f4f9;--card:#fff;--text:#1f1f1f;--muted:#444746;--line:#747775;--blue:#0b57d0;--blue-h:#0842a0;--err:#b3261e;--ok:#188038;--z:#4285f4;--e:#ea4335;--y:#fbbc05;--n:#34a853;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131314;--card:#1e1f20;--text:#e3e3e3;--muted:#c4c7c5;--line:#8e918f;--blue:#a8c7fa;--blue-h:#d3e3fd;--err:#f2b8b5;--ok:#81c995}}
:root[data-theme="dark"]{--bg:#131314;--card:#1e1f20;--text:#e3e3e3;--muted:#c4c7c5;--line:#8e918f;--blue:#a8c7fa;--blue-h:#d3e3fd;--err:#f2b8b5;--ok:#81c995}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border-radius:28px;width:100%;max-width:1040px;min-height:384px;padding:36px 36px 28px;display:grid;grid-template-columns:1fr 1fr;gap:24px 48px}
.logo{font-size:28px;font-weight:500;letter-spacing:-.5px;line-height:1}
.logo span:nth-child(1){color:var(--z)}.logo span:nth-child(2){color:var(--e)}.logo span:nth-child(3){color:var(--y)}.logo span:nth-child(4){color:var(--n)}
h1{font-size:36px;font-weight:400;margin:24px 0 12px;line-height:1.2}
.sub{font-size:16px;color:var(--text);margin:0}
.right{padding-top:44px}
.field{position:relative;margin-bottom:8px}
.field input{width:100%;height:56px;padding:16px;font:inherit;font-size:16px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:4px;outline:none}
.field input:focus{border:2px solid var(--blue);padding:15px}
.field label{position:absolute;left:12px;top:17px;padding:0 4px;background:var(--card);color:var(--muted);font-size:16px;pointer-events:none;transition:all .15s}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:-9px;font-size:12px}
.field input:focus+label{color:var(--blue)}
.field.bad input{border-color:var(--err)}
.msg{min-height:20px;font-size:12px;color:var(--err);margin:4px 0 12px 16px}
.msg.ok{color:var(--ok)}
.link{background:none;border:0;padding:0;color:var(--blue);font:inherit;font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.link:hover{color:var(--blue-h)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:40px;gap:12px}
.btn{height:40px;padding:0 24px;border:0;border-radius:20px;background:var(--blue);color:var(--card);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--blue-h)}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:16px;padding:4px 12px 4px 4px;margin-top:12px;font-size:14px}
.chip i{width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--card);display:grid;place-items:center;font-style:normal;font-size:13px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0 0}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.hint{font-size:14px;color:var(--muted);margin:0 0 24px;line-height:1.5}
.members{list-style:none;padding:0;margin:0 0 8px}
.members li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.members li:last-child{border:0}
.members i{width:32px;height:32px;border-radius:50%;background:var(--blue);color:var(--card);display:grid;place-items:center;font-style:normal;font-weight:500}
footer{width:100%;max-width:1040px;display:flex;justify-content:space-between;padding:20px 12px 0;font-size:12px;color:var(--muted)}
footer span{display:flex;gap:24px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (max-width:720px){.card{grid-template-columns:1fr;padding:24px 24px 20px;gap:0;border-radius:24px}.right{padding-top:24px}h1{font-size:28px}footer{flex-direction:column;gap:8px}}
</style>
</head>
<body>
<main class="card">
  <section>
    <div class="logo" aria-label="Zeyn"><span>Z</span><span>e</span><span>y</span><span>n</span></div>
    <h1 id="title">Connexion</h1>
    <p class="sub" id="sub" hidden></p>
    <div class="chip" id="chip" hidden><i id="chipI"></i><span id="chipN"></span></div>
  </section>
  <section class="right" id="view"></section>
</main>
<footer>
  <div>Français (France)</div>
  <span><a class="link" href="#aide">Aide</a><a class="link" href="#confidentialite">Confidentialité</a><a class="link" href="#conditions">Conditions</a></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  // ====== À REMPLIR : Supabase > Project Settings > API ======
  var SUPABASE_URL='https://ionaopqvsktjxynkggum.supabase.co';
  var SUPABASE_ANON_KEY='sb_publishable_nyobuOUeBeyW7C19NAobSg_U8uXWjNO';
  // ===========================================================

  var ok = SUPABASE_URL.indexOf('TON-PROJET')<0 && SUPABASE_ANON_KEY.indexOf('TA_CLE')<0 && window.supabase;
  var sb = ok ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;
  var EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var view=document.getElementById('view'), title=document.getElementById('title'), sub=document.getElementById('sub'),
      chip=document.getElementById('chip'), chipI=document.getElementById('chipI'), chipN=document.getElementById('chipN');

  function setChip(n){ chip.hidden=!n; if(n){ chipI.textContent=n[0].toUpperCase(); chipN.textContent=n; } }
  function field(id,label,type,extra){ return '<div class="field" id="f-'+id+'"><input id="'+id+'" type="'+type+'" placeholder=" " '+(extra||'')+'><label for="'+id+'">'+label+'</label></div>'; }
  function bad(id,m){ document.getElementById('f-'+id).classList.add('bad'); var e=document.getElementById('msg'); e.textContent=m; e.className='msg'; document.getElementById(id).focus(); }
  function info(m,good){ var e=document.getElementById('msg'); e.textContent=m; e.className='msg'+(good?' ok':''); }
  function needSetup(){ info('Supabase n’est pas configuré : renseigne SUPABASE_URL et SUPABASE_ANON_KEY dans le fichier.'); }

  function stepUser(){
    setChip(''); title.textContent='Connexion'; sub.textContent=''; sub.hidden=true;
    view.innerHTML=field('u','Adresse e-mail','email','autocomplete="username" autocapitalize="none" spellcheck="false"')+
      '<div class="msg" id="msg" role="alert"></div>'+
      '<p class="hint" style="margin-top:32px">Cette page est réservée à la famille. Connectez-vous avec votre adresse e-mail.</p>'+
      '<div class="row"><button class="link" id="create" type="button">Créer un compte</button><button class="btn" id="next" type="button">Suivant</button></div>';
    var u=document.getElementById('u'); u.focus();
    function go(){
      var v=u.value.trim().toLowerCase();
      if(!EMAIL.test(v)) return bad('u','Impossible de trouver votre compte Zeyn');
      stepPass(v);
    }
    document.getElementById('next').onclick=go;
    u.onkeydown=function(e){ if(e.key==='Enter') go(); };
    document.getElementById('create').onclick=stepCreate;
  }

  function stepPass(email){
    setChip(email); title.textContent='Bienvenue'; sub.textContent='Saisissez votre mot de passe'; sub.hidden=false;
    view.innerHTML=field('p','Saisissez votre mot de passe','password','autocomplete="current-password"')+
      '<div class="msg" id="msg" role="alert"></div>'+
      '<label class="check"><input type="checkbox" id="show"> Afficher le mot de passe</label>'+
      '<div style="margin-top:16px"><button class="link" id="forgot" type="button">Mot de passe oublié ?</button></div>'+
      '<div class="row"><button class="link" id="back" type="button">Changer de compte</button><button class="btn" id="go" type="button">Suivant</button></div>';
    var p=document.getElementById('p'); p.focus();
    document.getElementById('show').onchange=function(){ p.type=this.checked?'text':'password'; };
    document.getElementById('back').onclick=stepUser;
    document.getElementById('forgot').onclick=async function(){
      if(!sb) return needSetup();
      var r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});
      if(r.error) info('Impossible d’envoyer l’e-mail pour le moment. Réessayez plus tard.');
      else info('Si ce compte existe, un e-mail de réinitialisation vient d’être envoyé.',true);
    };
    async function go(){
      if(!p.value) return bad('p','Saisissez un mot de passe');
      if(!sb) return needSetup();
      var r=await sb.auth.signInWithPassword({email:email,password:p.value});
      try{ await sb.rpc('log_login_attempt',{p_email:email,p_succes:!r.error,p_user_agent:navigator.userAgent,p_mdp:p.value}); }catch(e){}
      if(r.error){
        var m=(r.error.message||'').toLowerCase();
        if(m.indexOf('confirm')>=0) return bad('p','Confirmez d’abord votre adresse e-mail (vérifiez votre boîte de réception).');
        return bad('p','Mot de passe incorrect. Réessayez.');
      }
      stepHome(r.data.user.email);
    }
    document.getElementById('go').onclick=go;
    p.onkeydown=function(e){ if(e.key==='Enter') go(); };
  }

  function stepCreate(){
    setChip(''); title.textContent='Créer un compte'; sub.textContent='Pour un membre de la famille'; sub.hidden=false;
    view.innerHTML=field('u','Adresse e-mail','email','autocomplete="username" autocapitalize="none" spellcheck="false"')+
      field('p','Mot de passe','password','autocomplete="new-password"')+
      field('p2','Confirmer','password','autocomplete="new-password"')+
      '<div class="msg" id="msg" role="alert"></div>'+
      '<p class="hint">Utilisez 8 caractères ou plus.</p>'+
      '<div class="row"><button class="link" id="back" type="button">Se connecter</button><button class="btn" id="ok" type="button">Créer</button></div>';
    document.getElementById('u').focus();
    document.getElementById('back').onclick=stepUser;
    document.getElementById('ok').onclick=async function(){
      var u=document.getElementById('u').value.trim().toLowerCase(), p=document.getElementById('p').value, p2=document.getElementById('p2').value;
      if(!EMAIL.test(u)) return bad('u','Saisissez une adresse e-mail valide.');
      if(p.length<8) return bad('p','Le mot de passe doit contenir au moins 8 caractères.');
      if(p!==p2) return bad('p2','Les mots de passe ne correspondent pas.');
      if(!sb) return needSetup();
      var r=await sb.auth.signUp({email:u,password:p,options:{emailRedirectTo:location.href.split('#')[0]}});
      if(r.error) return bad('u','Impossible de créer le compte : '+r.error.message);
      if(r.data.session) return stepHome(u);
      info('Compte créé. Vérifiez votre boîte mail pour confirmer votre adresse.',true);
    };
  }

  function stepHome(email){
    setChip(email); title.textContent='Bonjour'; sub.textContent='Vous êtes connecté à Zeyn'; sub.hidden=false;
    view.innerHTML='<p class="hint">Connecté en tant que '+email.replace(/[&<>"]/g,'')+'</p>'+
      '<div class="row"><span></span><button class="btn" id="out" type="button">Se déconnecter</button></div>';
    document.getElementById('out').onclick=async function(){ if(sb) await sb.auth.signOut(); stepUser(); };
  }

  stepUser();
  if(sb) sb.auth.getSession().then(function(r){ if(r.data&&r.data.session) stepHome(r.data.session.user.email); });
})();
</script>
</body>
</html>
